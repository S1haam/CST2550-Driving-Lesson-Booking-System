<!DOCTYPE html>
<html>
<head>
    <title>Delete Account - SER Driving School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Delete Account</h1>

        <p style="color:#444; font-size:14px; margin-bottom:20px;">
            Deleting your account is permanent. All your data, bookings, and personal information will be removed.
            This action cannot be undone.
        </p>

        <form method="post" action="/Learner/DeleteAccount">

            
            <input type="password" name="Password" placeholder="Enter your password to confirm" required>

         
            <input type="text" name="ConfirmText" placeholder="Type DELETE to confirm" required>

            <button type="submit" class="delete-btn" style="width:100%;">Delete My Account</button>

            <button type="button" class="back-btn" onclick="location.href='learner-settings.html'">Back</button>

        </form>
    </div>

</body>
</html>
