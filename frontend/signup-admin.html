<!DOCTYPE html>
<html>
<head>
    <title>Admin Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>WELCOME TO SER DRIVING SCHOOL</h1>
        <h3>Sign Up: Admin</h3>

        <form method="post" action="http://localhost:5000/Admin/Register">

            <!-- Admin email -->
            <input type="email" name="AdminEmail" placeholder="Admin Email" required>

            <!-- Admin password -->
            <input type="password" name="AdminPassword" placeholder="Password" required>

            <!-- Confirm password -->
            <input type="password" name="ConfirmAdminPassword" placeholder="Confirm Password" required>

           

            <button type="submit">Sign Up</button>
        </form>
        <!-- Button links to the start page -->
        <button class="back-btn" onclick="location.href='start.html'">Back</button>
    </div>

</body>
</html>
