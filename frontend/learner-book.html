<!DOCTYPE html>
<html>
<head>
    <title>Book Lessons - SER Driving School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <button onclick="location.href='learner-dashboard.html'">Home</button>
        <button onclick="location.href='learner-schedule.html'">My Schedule</button>
        <button onclick="location.href='learner-book.html'">Book Lessons</button>
        <button onclick="location.href='learner-faq.html'">FAQs</button>
        <button onclick="location.href='learner-settings.html'">Settings</button>
    </div>

    <div class="container">

        <h1>Select a Date</h1>

        <p>Please select the available dates:</p>

        <form method="get" action="learner-book-time.html">

            <div class="calendar-grid">

                <!-- Dates that are available -->
                <label class="date-box">
                    <input type="radio" name="date" value="2025-08-15" required>
                    <span>15/08/2025</span>
                </label>

                <label class="date-box">
                    <input type="radio" name="date" value="2025-08-17">
                    <span>17/08/2025</span>
                </label>

                <label class="date-box">
                    <input type="radio" name="date" value="2025-08-19">
                    <span>19/08/2025</span>
                </label>

                <!-- Dates that are not available -->
                <div class="date-box date-unavailable">20/08/2025</div>

                <label class="date-box">
                    <input type="radio" name="date" value="2025-08-21">
                    <span>21/08/2025</span>
                </label>


                <div class="date-box date-unavailable">22/08/2025</div>

                <label class="date-box">
                    <input type="radio" name="date" value="2025-08-27">
                    <span>27/08/2025</span>
                </label>

            </div>
            <!-- Submit Button -->

            <button type="submit"> Next: time selection</button>

        </form>

    </div>

</body>
</html>
