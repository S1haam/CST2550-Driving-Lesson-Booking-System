<!DOCTYPE html>
<html>
<head>
    <title>Instructor Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>WELCOME TO SER DRIVING SCHOOL</h1>
        <h3>Sign Up: Instructor</h3>

        <form method="post" action="http://localhost:5000/Instructor/Register">
            <!-- Enter Instructor ID -->
            <input type="text" name="InstructorCode" placeholder="Instructor ID" required>

            <!-- Enter Name -->
            <input type="text" name="InstructorName" placeholder="Full Name" required>

            <!-- Email email -->
            <input type="email" name="InstructorEmail" placeholder="Email Address" required>

            <!-- Enter password -->
            <input type="password" name="InstructorPassword" placeholder="Password" required>

            <!-- Confirm password -->
            <input type="password" name="ConfirmInstructorPassword" placeholder="Confirm Password" required>

            <!-- Instructor chooses what type of car they would like to teach -->
            <select name="InstructorCarType" required>
                <option value="" disabled selected>Select Car Type</option>
                <option value="Manual">Manual</option>
                <option value="Automatic">Automatic</option>
            </select>

            <button type="submit">Sign Up</button>
        </form>

        <button class="back-btn" onclick="location.href='start.html'">Back</button>
    </div>

</body>
</html>
