<!DOCTYPE html>
<html>
<head>
    <title>Select Lesson Type - SER Driving School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>WELCOME TO SER DRIVING SCHOOL</h1>
        <h3>Would you like to learn:</h3>

        <form method="post" action="http://localhost:5000/Learner/SelectLessonType">

            
            <input type="hidden" name="LearnerId" value="">

            <!-- Manual or Automatic selection -->
            <button type="submit" name="LessonType" value="Automatic">Automatic</button>
            <button type="submit" name="LessonType" value="Manual">Manual</button>

            <div class="nav-buttons">
                <button type="button" class="back-btn" onclick="location.href='signup-learner.html'">Back</button>
                <button type="button" class="next-btn" onclick="location.href='login.html'">Next</button>
            </div>

        </form>
    </div>

</body>
</html>
