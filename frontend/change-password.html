<!DOCTYPE html>
<html>
<head>
    <title>Change Password - SER Driving School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Change Password</h1>

        <form method="post" action="/Learner/ChangePassword">

            <!-- Current password -->
            <input type="password" name="CurrentPassword" placeholder="Current Password" required>

            <!-- New password -->
            <input type="password" name="NewPassword" placeholder="New Password" required>

            <!-- Confirm new password -->
            <input type="password" name="ConfirmNewPassword" placeholder="Confirm New Password" required>

            <button type="submit">Update Password</button>

            <button type="button" class="back-btn" onclick="location.href='learner-settings.html'">Back</button>

        </form>
    </div>

</body>
</html>
