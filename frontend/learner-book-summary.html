<!DOCTYPE html>
<html>
<head>
    <title>Booking Summary - SER Driving School</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .summary-box {
            background: #e8f0ff;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #b8cfff;
        }

        .summary-item {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            padding: 10px 18px;
            background: #444;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

            .back-btn:hover {
                background: #222;
            }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <button onclick="location.href='learner-dashboard.html'">Home</button>
        <button onclick="location.href='learner-schedule.html'">My Schedule</button>
        <button onclick="location.href='learner-book.html'">Book Lessons</button>
        <button onclick="location.href='learner-faq.html'">FAQs</button>
        <button onclick="location.href='learner-settings.html'">Settings</button>
    </div>

    <div class="container" style="width: 450px;">

        <h1>Summary Selection</h1>

        <p style="font-size: 15px; margin-bottom: 20px;">
            Please review your booking details:
        </p>

        <!-- Summary Section -->
        <div class="summary-box">


            <div class="summary-item">
                <strong>Date:</strong>
            </div>

            <div class="summary-item">
                <strong>Time:</strong>
            </div>

            <div class="summary-item">
                <strong>Fee:</strong> £67
            </div>

        </div>


        <form method="get" action="learner-book-confirmed.html">



            <input type="hidden" name="date" value="">
            <input type="hidden" name="time" value="">
            <input type="hidden" name="fee" value="67">

            <!-- Back button -->
            <a href="learner-book-time.html" class="back-btn">Back</a>

            <button type="submit">Confirm booking</button>

        </form>

    </div>

</body>
</html>
