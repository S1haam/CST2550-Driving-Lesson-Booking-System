<!DOCTYPE html>
<html>
<head>
    <title>Llearner Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>WELCOME TO SER DRIVING SCHOOL</h1>
        <h3>Sign Up: Learner</h3>

        <form method="post" action="http://localhost:5000/Learner/Register">

            <!--Enter Provisional Licence -->
            <input type="text" name="LicenceId" placeholder="Provisional Licence ID" required>

            <!-- Enter Name -->
            <input type="text" name="LearnerName" placeholder="Full Name" required>

            <!-- Enter Email -->
            <input type="email" name="LearnerEmail" placeholder="Email Address" required>

            <!-- Enter Password -->
            <input type="password" name="LearnerPassword" placeholder="Password" required>

            <!-- Confirm password -->
            <input type="password" name="ConfirmLearnerPassword" placeholder="Confirm Password" required>

            <button type="submit">Sign Up</button>
        </form>

        <button class="back-btn" onclick="location.href='start.html'">Back</button>
    </div>

</body>
</html>
